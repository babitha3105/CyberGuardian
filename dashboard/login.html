<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberGuardian - Parent Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #1f2937;
            font-size: 30px;
        }

        .logo p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1f2937;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #4b5563;
            cursor: pointer;
            font-size: 13px;
            padding: 5px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #1f2937;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #111827;
        }

        .login-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-link a {
            color: #1f2937;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>🛡️ CyberGuardian</h1>
            <p>Parent Security Dashboard</p>
        </div>

        <h2>Parent Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-container">

                    <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                    >

                    <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                    >
                        Show
                    </button>

                </div>
            </div>

            <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
            >
                Login
            </button>

            <div
                    class="error-message"
                    id="errorMessage"
            ></div>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create account</a>
        </div>

    </div>

    <div class="footer">
        CyberGuardian © 2026
    </div>

</div>

<script>

    const passwordInput = document.getElementById("password");
    const showPasswordButton = document.getElementById("showPassword");

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");


    /* Show / Hide Password */

    showPasswordButton.addEventListener("click", () => {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";
            showPasswordButton.textContent = "Hide";

        } else {

            passwordInput.type = "password";
            showPasswordButton.textContent = "Show";

        }

    });


    /* Login */

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        errorMessage.style.display = "none";
        errorMessage.textContent = "";

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {

            const response = await fetch(
                "http://localhost:8080/api/parents/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const text = await response.text();

            console.log("LOGIN STATUS:", response.status);
            console.log("LOGIN RESPONSE:", text);

            if (!response.ok) {
                throw new Error(
                    text || "Invalid email or password"
                );
            }

            /*
             * Backend currently returns the JWT
             * directly as a String.
             */
            const token = text;

            localStorage.setItem("jwtToken", token);

            console.log("Login successful.");

            window.location.href = "index.html?login=" + Date.now();
        } catch (error) {

            console.error("Login failed:", error);

            errorMessage.textContent =
                error.message || "Login failed. Please try again.";

            errorMessage.style.display = "block";

        } finally {

            loginButton.disabled = false;
            loginButton.textContent = "Login";

        }

    });
</script>

</body>
</html>
