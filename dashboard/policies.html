<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CyberGuardian - Website Policies</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 40px;
        }

        .back-button {
            margin-bottom: 20px;
        }

        .section {
            background-color: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #1f2937;
            color: white;
        }

        button:hover {
            background-color: #374151;
        }

    </style>

</head>

<body>

<header>

    <h1>CyberGuardian</h1>

    <p>Website Policy Management</p>

</header>

<div class="container">

    <button
            class="back-button"
            onclick="window.location.href='index.html'">

        ← Back to Dashboard

    </button>

    <div class="section">

        <h2>Website Policies</h2>

        <div id="policyList">
            Loading policies...
        </div>

    </div>

    <div class="section">

        <h2>Add Website Policy</h2>

        <input
                type="text"
                id="website"
                placeholder="Enter website, e.g. example.com"
                style="
                    padding: 10px;
                    width: 60%;
                    margin-right: 10px;
                    border: 1px solid #d1d5db;
                    border-radius: 6px;
                "
        >

        <select
                id="action"
                style="
                    padding: 10px;
                    margin-right: 10px;
                    border: 1px solid #d1d5db;
                    border-radius: 6px;
                "
        >

            <option value="BLOCK">BLOCK</option>
            <option value="ALLOW">ALLOW</option>

        </select>

        <button onclick="createPolicy()">
            Add Policy
        </button>

    </div>

</div>

<script>

    const token =
        localStorage.getItem("jwtToken");

    const selectedChildId =
        localStorage.getItem("selectedChildId");

    if (!token) {

        window.location.href = "login.html";

    }

    if (!selectedChildId) {

        alert("No child selected.");

        window.location.href = "index.html";

    }


    function createPolicy() {

        const website =
            document.getElementById("website")
                .value
                .trim();

        const action =
            document.getElementById("action")
                .value;

        if (website === "") {

            alert("Please enter a website.");

            return;

        }

        const policyData = {

            child: {
                childId: Number(selectedChildId)
            },

            targetType: "WEBSITE",

            targetValue: website,

            action: action

        };

        fetch(
            "http://localhost:8080/api/policies",
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token

                },

                body:
                    JSON.stringify(policyData)

            }
        )
            .then(async response => {

                console.log(
                    "CREATE POLICY STATUS:",
                    response.status
                );

                const text =
                    await response.text();

                console.log(
                    "CREATE POLICY RESPONSE:",
                    text
                );

                if (!response.ok) {

                    throw new Error(
                        "Policy creation failed with status "
                        + response.status
                    );

                }

                return JSON.parse(text);

            })
            .then(policy => {

                console.log(
                    "Policy created:",
                    policy
                );

                alert(
                    "Policy added successfully!"
                );

                document.getElementById(
                    "website"
                ).value = "";

                loadPolicies();

            })
            .catch(error => {

                console.error(
                    "Policy creation failed:",
                    error
                );

                alert(
                    "Failed to add policy."
                );

            });

    }


    function loadPolicies() {

        fetch(
            `http://localhost:8080/api/policies/child/${selectedChildId}`,
            {
                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + token

                }

            }
        )
            .then(async response => {

                console.log(
                    "POLICIES STATUS:",
                    response.status
                );

                const text =
                    await response.text();

                console.log(
                    "POLICIES RESPONSE:",
                    text
                );

                if (!response.ok) {

                    throw new Error(
                        "Failed to load policies"
                    );

                }

                return JSON.parse(text);

            })
            .then(policies => {

                console.log(
                    "Policies received:",
                    policies
                );

                const container =
                    document.getElementById(
                        "policyList"
                    );

                container.innerHTML = "";

                if (policies.length === 0) {

                    container.textContent =
                        "No website policies.";

                    return;

                }

                policies.forEach(policy => {

                    const entry =
                        document.createElement(
                            "div"
                        );

                    entry.style.padding =
                        "12px";

                    entry.style.borderBottom =
                        "1px solid #e5e7eb";

                    entry.innerHTML = `
                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            gap: 20px;
                        ">

                            <div>

                                <strong style="
                                    font-size: 16px;
                                ">
                                    ${policy.targetValue}
                                </strong>

                                <div style="
                                    margin-top: 5px;
                                    color: #6b7280;
                                    font-size: 14px;
                                ">

                                    Action:

                                    <strong>
                                        ${policy.action}
                                    </strong>

                                </div>

                            </div>

                            <div>

                                <button
                                    onclick="
                                        editPolicy(
                                            ${policy.policyId}
                                        )
                                    "
                                    style="
                                        margin-right: 5px;
                                    "
                                >
                                    Edit
                                </button>

                                <button
                                    onclick="
                                        deletePolicy(
                                            ${policy.policyId}
                                        )
                                    "
                                >
                                    Delete
                                </button>

                            </div>

                        </div>
                    `;

                    container.appendChild(
                        entry
                    );

                });

            })
            .catch(error => {

                console.error(
                    "Loading policies failed:",
                    error
                );

                document.getElementById(
                    "policyList"
                ).textContent =
                    "Unable to load policies.";

            });

    }


    function deletePolicy(policyId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this policy?"
            );

        if (!confirmed) {

            return;

        }

        fetch(
            `http://localhost:8080/api/policies/${policyId}`,
            {
                method: "DELETE",

                headers: {

                    "Authorization":
                        "Bearer " + token

                }

            }
        )
            .then(async response => {

                console.log(
                    "DELETE POLICY STATUS:",
                    response.status
                );

                if (!response.ok) {

                    throw new Error(
                        "Policy deletion failed"
                    );

                }

            })
            .then(() => {

                alert(
                    "Policy deleted successfully."
                );

                loadPolicies();

            })
            .catch(error => {

                console.error(
                    "Policy deletion failed:",
                    error
                );

                alert(
                    "Failed to delete policy."
                );

            });

    }


    function editPolicy(policyId) {

        fetch(
            `http://localhost:8080/api/policies/child/${selectedChildId}`,
            {
                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + token

                }

            }
        )
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to load policy"
                    );

                }

                return response.json();

            })
            .then(policies => {

                const policy =
                    policies.find(
                        p =>
                            p.policyId === policyId
                    );

                if (!policy) {

                    alert(
                        "Policy not found."
                    );

                    return;

                }

                const container =
                    document.getElementById(
                        "policyList"
                    );

                container.innerHTML = `
                    <div style="
                        padding: 15px;
                        border: 1px solid #d1d5db;
                        border-radius: 8px;
                        margin-bottom: 10px;
                    ">

                        <label>
                            Website:
                        </label>

                        <input
                            type="text"
                            id="editWebsite"
                            value="${policy.targetValue}"
                            style="
                                padding: 8px;
                                margin-left: 8px;
                                width: 50%;
                                border: 1px solid #d1d5db;
                                border-radius: 6px;
                            "
                        >

                        <br><br>

                        <label>
                            Action:
                        </label>

                        <select
                            id="editAction"
                            style="
                                padding: 8px;
                                margin-left: 8px;
                                border: 1px solid #d1d5db;
                                border-radius: 6px;
                            "
                        >

                            <option
                                value="BLOCK"
                                ${
                    policy.action === "BLOCK"
                        ? "selected"
                        : ""
                }
                            >
                                BLOCK
                            </option>

                            <option
                                value="ALLOW"
                                ${
                    policy.action === "ALLOW"
                        ? "selected"
                        : ""
                }
                            >
                                ALLOW
                            </option>

                        </select>

                        <br><br>

                        <button
                            onclick="
                                saveEditedPolicy(
                                    ${policyId}
                                )
                            "
                        >
                            Save
                        </button>

                        <button
                            onclick="loadPolicies()"
                            style="
                                margin-left: 5px;
                            "
                        >
                            Cancel
                        </button>

                    </div>
                `;

            })
            .catch(error => {

                console.error(
                    "Failed to load policy:",
                    error
                );

                alert(
                    "Unable to edit policy."
                );

            });

    }


    function saveEditedPolicy(policyId) {

        const website =
            document.getElementById(
                "editWebsite"
            )
                .value
                .trim();

        const action =
            document.getElementById(
                "editAction"
            )
                .value;

        if (website === "") {

            alert(
                "Website cannot be empty."
            );

            return;

        }

        const policyData = {

            child: {
                childId:
                    Number(selectedChildId)
            },

            targetType:
                "WEBSITE",

            targetValue:
            website,

            action:
            action

        };

        fetch(
            `http://localhost:8080/api/policies/${policyId}`,
            {
                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token

                },

                body:
                    JSON.stringify(policyData)

            }
        )
            .then(async response => {

                console.log(
                    "UPDATE POLICY STATUS:",
                    response.status
                );

                const text =
                    await response.text();

                console.log(
                    "UPDATE POLICY RESPONSE:",
                    text
                );

                if (!response.ok) {

                    throw new Error(
                        "Policy update failed with status "
                        + response.status
                    );

                }

                return JSON.parse(text);

            })
            .then(updatedPolicy => {

                console.log(
                    "Policy updated:",
                    updatedPolicy
                );

                alert(
                    "Policy updated successfully."
                );

                loadPolicies();

            })
            .catch(error => {

                console.error(
                    "Policy update failed:",
                    error
                );

                alert(
                    "Failed to update policy."
                );

            });

    }


    loadPolicies();

</script>

</body>
</html>
