<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuardian - Website Policies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#eef2f0;--surface:#fff;--ink:#14231f;--muted:#5d6f69;--line:#dde5e1;--brand:#0f4c43;--brand-2:#1b6b5e;--soft:#e3efeb;
            --ok:#1f8a5b;--ok-bg:#dff3e9;--bad:#c0392b;--bad-bg:#fbe3df;--r:14px}
        @media(prefers-color-scheme:dark){:root{--bg:#0e1816;--surface:#16231f;--ink:#e7f0ed;--muted:#93a8a1;--line:#263733;--brand:#4fb8a3;--brand-2:#7fd1bf;--soft:#1c302b;
            --ok:#55d19a;--ok-bg:#173a2c;--bad:#ef8174;--bad-bg:#3e1f1b}}
        *{box-sizing:border-box}
        body{margin:0;font-family:Figtree,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
        button,select,input{font:inherit}
        :focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
        .top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
        .top-in{max-width:860px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
        .logo{font-family:Fraunces,Georgia,serif;font-size:22px;color:var(--brand);margin-right:auto;display:flex;align-items:center;gap:10px}
        .logo img{width:34px;height:34px;border-radius:9px;object-fit:cover;display:block}
        .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
        .btn:hover{background:var(--soft)}
        .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
        @media(prefers-color-scheme:dark){.btn.primary{color:#06201a}}
        .btn.primary:hover{background:var(--brand-2)}
        .btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
        .btn.bad:hover{background:#a52e22}
        .btn.sm{padding:5px 11px;font-size:13px}
        .btn:disabled{opacity:.55;cursor:not-allowed}
        .wrap{max-width:860px;margin:auto;padding:24px}
        h1{font-family:Fraunces,Georgia,serif;font-size:30px;margin:0 0 4px}
        .lead{color:var(--muted);margin:0 0 20px}
        .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
        .panel h2{margin:0 0 4px;font-size:18px}
        .panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
        .add{display:grid;grid-template-columns:1fr 140px auto;gap:10px}
        input,select{padding:11px 12px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;width:100%}
        input:focus,select:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--soft)}
        .item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
        .item:first-child{border-top:0}
        .item .name{font-weight:600;word-break:break-all}
        .item .btns{display:flex;gap:8px;flex:none}
        .tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-right:10px;vertical-align:middle}
        .tag.block{background:var(--bad-bg);color:var(--bad)}
        .tag.allow{background:var(--ok-bg);color:var(--ok)}
        .edit{display:grid;grid-template-columns:1fr 140px auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
        .edit .btns{display:flex;gap:8px}
        .empty{color:var(--muted);padding:6px 0}
        .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90%}
        .toast.on{opacity:1}
        .toast.err{background:var(--bad);color:#fff}
        @media(max-width:600px){.wrap{padding:14px}.add,.edit{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}
        @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
</head>
<body>

<header class="top"><div class="top-in">
    <div class="logo"><img src="icons/icon-192.png" alt="" width="34" height="34">CyberGuardian</div>
    <button class="btn" onclick="location.href='index.html'">← Back to dashboard</button>
</div></header>

<main class="wrap">
    <h1>Website policies</h1>
    <p class="lead">Choose which sites your child can open and which are blocked.</p>

    <section class="panel">
        <h2>Add a policy</h2>
        <p class="sub">Enter a site such as example.com and choose what happens when your child visits it.</p>
        <div class="add">
            <input type="text" id="website" placeholder="example.com" aria-label="Website" autocomplete="off">
            <select id="action" aria-label="Action">
                <option value="BLOCK">Block</option>
                <option value="ALLOW">Allow</option>
            </select>
            <button class="btn primary" id="addBtn" onclick="createPolicy()">Add policy</button>
        </div>
    </section>

    <section class="panel">
        <h2>Current policies</h2>
        <p class="sub" id="policyCount">Loading...</p>
        <div id="policyList">Loading policies...</div>
    </section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
    const API = "http://localhost:8080/api";
    const token = localStorage.getItem("jwtToken");
    const selectedChildId = localStorage.getItem("selectedChildId");
    const $ = id => document.getElementById(id);

    if (!token) location.href = "login.html";
    else if (!selectedChildId) location.href = "index.html";

    /* ---------- helpers ---------- */
    let toastTimer;
    function toast(text, isError) {
        const t = $("toast");
        t.textContent = text;
        t.className = "toast on" + (isError ? " err" : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = "toast"; }, 2600);
    }
    async function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
        const r = await fetch(API + path, opts);
        const text = await r.text();
        console.log(path, r.status);
        if (!r.ok) throw new Error(path + " failed with status " + r.status);
        return text ? JSON.parse(text) : null;
    }
    function el(tag, text, cls) {
        const e = document.createElement(tag);
        if (text !== undefined) e.textContent = text;
        if (cls) e.className = cls;
        return e;
    }
    function body(website, action) {
        return JSON.stringify({ child: { childId: Number(selectedChildId) }, targetType: "WEBSITE", targetValue: website, action: action });
    }
    const JSON_HDR = { "Content-Type": "application/json" };

    /* ---------- create ---------- */
    async function createPolicy() {
        const website = $("website").value.trim();
        if (!website) { toast("Enter a website first.", true); $("website").focus(); return; }
        $("addBtn").disabled = true;
        try {
            await api("/policies", { method: "POST", headers: JSON_HDR, body: body(website, $("action").value) });
            $("website").value = "";
            toast("Policy added.");
            loadPolicies();
        } catch (e) {
            console.error("Policy creation failed:", e);
            toast("Couldn't add the policy. Try again.", true);
        } finally { $("addBtn").disabled = false; }
    }
    $("website").addEventListener("keydown", e => { if (e.key === "Enter") createPolicy(); });

    /* ---------- list ---------- */
    let policiesCache = [];
    async function loadPolicies() {
        const list = $("policyList");
        try {
            policiesCache = await api("/policies/child/" + selectedChildId);
            list.replaceChildren();
            const blocked = policiesCache.filter(p => p.action === "BLOCK").length;
            $("policyCount").textContent = policiesCache.length
                ? policiesCache.length + " total: " + blocked + " blocked, " + (policiesCache.length - blocked) + " allowed"
                : "Nothing set up yet.";
            if (!policiesCache.length) { list.appendChild(el("div", "No website policies yet. Add one above.", "empty")); return; }
            policiesCache.forEach(p => list.appendChild(buildItem(p)));
        } catch (e) {
            console.error("Loading policies failed:", e);
            $("policyCount").textContent = "";
            list.textContent = "Unable to load policies.";
        }
    }
    function buildItem(p) {
        const item = el("div", undefined, "item");
        const left = el("div");
        left.appendChild(el("span", p.action === "BLOCK" ? "Blocked" : "Allowed", "tag " + String(p.action).toLowerCase()));
        left.appendChild(el("span", p.targetValue, "name"));
        const btns = el("div", undefined, "btns");
        const edit = el("button", "Edit", "btn sm");
        const del = el("button", "Delete", "btn bad sm");
        edit.onclick = () => editPolicy(p, item);
        del.onclick = () => deletePolicy(p.policyId);
        btns.append(edit, del);
        item.append(left, btns);
        return item;
    }

    /* ---------- delete ---------- */
    async function deletePolicy(policyId) {
        if (!confirm("Delete this policy?")) return;
        try {
            await api("/policies/" + policyId, { method: "DELETE" });
            toast("Policy deleted.");
            loadPolicies();
        } catch (e) {
            console.error("Policy deletion failed:", e);
            toast("Couldn't delete the policy.", true);
        }
    }

    /* ---------- edit (inline) ---------- */
    function editPolicy(p, item) {
        const form = el("div", undefined, "edit");
        const site = el("input");
        site.type = "text"; site.value = p.targetValue; site.setAttribute("aria-label", "Website");
        const act = el("select");
        [["BLOCK", "Block"], ["ALLOW", "Allow"]].forEach(([v, t]) => {
            const o = el("option", t); o.value = v; o.selected = p.action === v; act.appendChild(o);
        });
        const btns = el("div", undefined, "btns");
        const save = el("button", "Save", "btn primary sm");
        const cancel = el("button", "Cancel", "btn sm");
        cancel.onclick = () => form.replaceWith(item);
        save.onclick = async () => {
            const website = site.value.trim();
            if (!website) { toast("Website can't be empty.", true); return; }
            save.disabled = true;
            try {
                await api("/policies/" + p.policyId, { method: "PUT", headers: JSON_HDR, body: body(website, act.value) });
                toast("Policy updated.");
                loadPolicies();
            } catch (e) {
                console.error("Policy update failed:", e);
                toast("Couldn't update the policy.", true);
                save.disabled = false;
            }
        };
        btns.append(save, cancel);
        form.append(site, act, btns);
        item.replaceWith(form);
        site.focus();
    }

    loadPolicies();
</script>
</body>
</html>
